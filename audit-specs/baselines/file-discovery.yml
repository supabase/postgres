# Exceptions come from baseline.yml (AMI arm64), Ubuntu defaults, and CI findings.
# required: set by Ubuntu, Nix, cloud-init, or a shared-group design. Keep.
# to-be-fixed: looser than policy because of how this repo installs it. Tighten, then remove.
roots: [/etc, /opt, /data, /var/lib]
file_modes: ["0644", "0640", "0600", "0440", "0755"]
dir_modes: ["0755", "0750", "0700"]
exceptions:
  # required: setuid binaries shipped by Ubuntu packages
  /usr/bin/at: [setuid]
  /usr/bin/chage: [setuid]
  /usr/bin/chfn: [setuid]
  /usr/bin/chsh: [setuid]
  /usr/bin/crontab: [setuid]
  /usr/bin/dotlockfile: [setuid]
  /usr/bin/expiry: [setuid]
  /usr/bin/fusermount3: [setuid]
  /usr/bin/gpasswd: [setuid]
  /usr/bin/mount: [setuid]
  /usr/bin/newgrp: [setuid]
  /usr/bin/passwd: [setuid]
  /usr/bin/pkexec: [setuid]
  /usr/bin/ssh-agent: [setuid]
  /usr/bin/su: [setuid]
  /usr/bin/sudo: [setuid]
  /usr/bin/umount: [setuid]
  /usr/bin/wall: [setuid]
  /usr/bin/write.ul: [setuid]
  /usr/lib/aarch64-linux-gnu/utempter/utempter: [setuid]
  /usr/lib/dbus-1.0/dbus-daemon-launch-helper: [setuid]
  /usr/lib/openssh/ssh-keysign: [setuid]
  /usr/lib/polkit-1/polkit-agent-helper-1: [setuid]
  /usr/lib/x86_64-linux-gnu/utempter/utempter: [setuid]
  /usr/sbin/mount.nfs: [setuid]
  /usr/sbin/pam_extrausers_chkpwd: [setuid]
  /usr/sbin/unix_chkpwd: [setuid]

  # required: Ubuntu, Nix, and cloud-init defaults
  /etc/cloud/cloud.cfg: [mode]
  /etc/machine-id: [mode]
  /etc/nix: [mode]
  /var/lib/cloud/instances/**: [mode]
  /var/lib/cloud/scripts/per-boot/supaboot.sh: [mode]
  /var/local: [group-writable]
  /var/log/btmp: [group-writable]
  /var/log/lastlog: [group-writable]
  /var/log/wtmp: [group-writable]
  /var/mail: [group-writable]

  # required: directories shared by the postgres and service groups
  /etc/pgbackrest: [group-writable, mode]
  /etc/pgbackrest/conf.d: [group-writable, mode]
  /etc/wal-g: [group-writable, mode]
  /var/lib/pgbackrest: [group-writable, mode]
  /var/log/pgbackrest/**: [group-writable]
  /var/spool/pgbackrest: [group-writable]

  # to-be-fixed: group-writable or 0775 directories created by ansible
  /etc: [group-writable, mode]
  /etc/auth.d: [group-writable, mode]
  /etc/envoy: [group-writable, mode]
  /etc/kong: [group-writable, mode]
  /etc/postgresql: [group-writable, mode]
  /etc/postgresql-custom: [group-writable, mode]
  /etc/postgresql-custom/conf.d: [group-writable, mode]
  /etc/postgrest: [group-writable, mode]
  /etc/vector: [group-writable, mode]
  /opt/gotrue: [group-writable, mode]
  /opt/postgres_exporter: [group-writable, mode]

  # to-be-fixed: group-writable or 0664 files created by ansible
  /etc/envoy/cds.yaml: [group-writable, mode]
  /etc/envoy/envoy.yaml: [group-writable, mode]
  /etc/envoy/lds.yaml: [group-writable, mode]
  /etc/gotrue.env: [group-writable, mode]
  /etc/kong/kong.conf: [group-writable, mode]
  /etc/kong/kong.conf.default: [group-writable, mode]
  /etc/kong/kong.logrotate: [group-writable, mode]
  /etc/pam.d/postgresql: [group-writable, mode]
  /etc/pgbouncer-custom/**: [group-writable, mode]
  /etc/pgbouncer/userlist.txt: [group-writable, mode]
  /etc/postgresql-custom/custom-overrides.conf: [group-writable, mode]
  /etc/postgresql-custom/extension-custom-scripts/**: [group-writable, mode]
  /etc/postgresql-custom/generated-optimizations.conf: [group-writable, mode]
  /etc/postgresql-custom/read-replica.conf: [group-writable, mode]
  /etc/postgresql-custom/supautils.conf: [group-writable, mode]
  /etc/postgresql-custom/wal-g.conf: [group-writable, mode]
  /etc/postgresql/pg_hba.conf: [group-writable, mode]
  /etc/postgrest/base.conf: [group-writable, mode]
  /etc/vector/examples/**: [group-writable, mode]
  /etc/vector/vector.yaml: [group-writable, mode]
  /etc/wal-g/config.json: [group-writable, mode]
  /usr/lib/systemd/system/kong.service: [group-writable]

  # to-be-fixed: modes outside the allowlist
  /etc/logrotate.d/logrotate-pgbackrest.conf: [mode]
  /etc/logrotate.d/logrotate-postgres-auth.conf: [mode]
  /etc/logrotate.d/logrotate-postgres-csv.conf: [mode]
  /etc/logrotate.d/logrotate-postgres.conf: [mode]
  /etc/logrotate.d/logrotate-walg.conf: [mode]
  /etc/postgrest/merge.sh: [mode]
  /etc/ssl/adminapi/server.crt: [mode]
  /etc/ssl/adminapi/server.key: [mode]
  /etc/systemd/system/vector.timer: [mode]
  /etc/udev/rules.d/70-ec2-nvme-devices.rules: [mode]
  /opt/envoy: [mode]
  /opt/envoy-hot-restarter.py: [mode]
  /opt/start-envoy.sh: [mode]

  # to-be-fixed: group-writable trees under /usr/local, which is outside roots
  /usr/local/bin/kong: [group-writable]
  /usr/local/bin/lapis: [group-writable]
  /usr/local/bin/luarocks: [group-writable]
  /usr/local/bin/luarocks-admin: [group-writable]
  /usr/local/etc/luarocks: [group-writable]
  /usr/local/etc/luarocks/config-5.1.lua: [group-writable]
  /usr/local/kong/**: [group-writable]
  /usr/local/lib/lua/**: [group-writable]
  /usr/local/lib/luarocks/**: [group-writable]
  /usr/local/openresty/**: [group-writable]
  /usr/local/share/fonts: [group-writable]
  /usr/local/share/lua/**: [group-writable]
