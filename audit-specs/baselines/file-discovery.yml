# Filesystem discovery policy for supascan validate.
# Exceptions come from baseline.yml (AMI arm64) and Ubuntu defaults.
roots: [/etc, /usr/local, /opt, /data, /var/lib]
file_modes: ["0644", "0640", "0600", "0440", "0755"]
dir_modes: ["0755", "0750", "0700"]
setuid:
  - /usr/bin/chage
  - /usr/bin/chfn
  - /usr/bin/chsh
  - /usr/bin/crontab
  - /usr/bin/dotlockfile
  - /usr/bin/expiry
  - /usr/bin/fusermount3
  - /usr/bin/gpasswd
  - /usr/bin/mount
  - /usr/bin/newgrp
  - /usr/bin/passwd
  - /usr/bin/pkexec
  - /usr/bin/ssh-agent
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/umount
  - /usr/bin/wall
  - /usr/bin/write.ul
  - /usr/lib/dbus-1.0/dbus-daemon-launch-helper
  - /usr/lib/openssh/ssh-keysign
  - /usr/lib/polkit-1/polkit-agent-helper-1
  - /usr/sbin/pam_extrausers_chkpwd
  - /usr/sbin/unix_chkpwd
exceptions:
  - /var/local
  - /var/mail
  - /var/log/btmp
  - /var/log/lastlog
  - /var/log/wtmp
  - /var/lib/cloud/instances/**
  - /usr/local/kong/**
  - /usr/local/openresty/**
  - /etc/vector/examples/**
  - /etc/pgbouncer-custom/**
  - /etc/postgresql-custom/extension-custom-scripts/**
  - /etc/envoy/envoy.yaml
  - /etc/envoy/lds.yaml
  - /etc/gotrue.env
  - /etc/kong/kong.conf
  - /etc/kong/kong.conf.default
  - /etc/kong/kong.logrotate
  - /etc/logrotate.d/logrotate-postgres-auth.conf
  - /etc/logrotate.d/logrotate-postgres-csv.conf
  - /etc/logrotate.d/logrotate-postgres.conf
  - /etc/logrotate.d/logrotate-walg.conf
  - /etc/machine-id
  - /etc/pgbouncer/userlist.txt
  - /etc/postgresql-custom/custom-overrides.conf
  - /etc/postgresql-custom/generated-optimizations.conf
  - /etc/postgresql-custom/read-replica.conf
  - /etc/postgresql-custom/supautils.conf
  - /etc/postgresql-custom/wal-g.conf
  - /etc/postgresql/pg_hba.conf
  - /etc/postgrest/base.conf
  - /etc/postgrest/merge.sh
  - /etc/ssl/adminapi/server.crt
  - /etc/ssl/adminapi/server.key
  - /etc/wal-g/config.json
  - /opt/envoy
  - /opt/envoy-hot-restarter.py
  - /opt/start-envoy.sh
  - /usr/lib/systemd/system/kong.service
  - /usr/local/bin/kong
  - /usr/local/bin/lapis
  - /usr/local/bin/luarocks
  - /usr/local/bin/luarocks-admin
  - /usr/local/bin/project-init.sh
  - /usr/local/bin/systemd-networkd-check-and-fix.sh
  - /usr/local/etc/luarocks/config-5.1.lua
  - /var/lib/cloud/scripts/per-boot/supaboot.sh
