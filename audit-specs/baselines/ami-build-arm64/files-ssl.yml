# File baseline: ssl
# SSL certificate and key directories for AMI build
# Uses string names for owner/group (not numeric IDs)
file:
  # System SSL directory
  /etc/ssl:
    exists: true
    filetype: directory
    owner: root
    group: root
    mode: '0755'
  /etc/ssl/certs:
    exists: true
    filetype: directory
    owner: root
    group: root
    mode: '0755'
  /etc/ssl/private:
    exists: true
    filetype: directory
    owner: root
    group: postgres
    mode: '0750'
  /etc/ssl/openssl.cnf:
    exists: true
    filetype: file
    owner: root
    group: root
    mode: '0644'
  # eMudhra's emSign ECC Root CA - G3 is distrusted after intermediate CA key
  # compromise (https://emudhra.we-have-a-problem.com/). Removed in Ubuntu
  # ca-certificates 20260816ubuntu0.24.04.1.
  /usr/share/ca-certificates/mozilla/emSign_ECC_Root_CA_-_G3.crt:
    exists: false
  /etc/ssl/certs/emSign_ECC_Root_CA_-_G3.pem:
    exists: false
  /etc/ssl/certs/ca-certificates.crt:
    exists: true
    contents:
      # Start of the emSign ECC Root CA - G3 public key
      - "!djAQBgcqhkjOPQIBBgUrgQQAIgNiAAQjpQy4LRL1KPOxst3iAhKAnjlfSU2fySU0"
  # Note: /etc/ssl/adminapi is created at deploy time, not during AMI build
