# File baseline: postgres-data
# PostgreSQL data directory for AMI build
# Uses string names for owner/group (not numeric IDs)
file:
  # PostgreSQL data directory
  /var/lib/postgresql:
    exists: true
    filetype: directory
    owner: postgres
    group: postgres
    mode: '0755'
  /var/lib/postgresql/data:
    exists: true
    filetype: directory
    owner: postgres
    group: postgres
    mode: '0700'
