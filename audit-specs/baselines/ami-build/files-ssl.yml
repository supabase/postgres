# File baseline: ssl
# SSL certificate and key directories for AMI build
# Uses string names for owner/group (not numeric IDs)
file:
  # System SSL directory
  /etc/ssl:
    exists: true
    filetype: directory
    owner: root
    group: root
    mode: '0755'
  /etc/ssl/certs:
    exists: true
    filetype: directory
    owner: root
    group: root
    mode: '0755'
  /etc/ssl/private:
    exists: true
    filetype: directory
    owner: root
    group: ssl-cert
    mode: '0710'
  /etc/ssl/openssl.cnf:
    exists: true
    filetype: file
    owner: root
    group: root
    mode: '0644'

  # AdminAPI SSL directory (created during AMI build)
  /etc/ssl/adminapi:
    exists: true
    filetype: directory
    owner: adminapi
    group: root
    mode: '0700'
