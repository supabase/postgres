name: Update Flake Lock

on:
  workflow_dispatch:
  # TODO: enable scheduled updates when nixpkgs is updated.
  # schedule:
  #   - cron: '0 0 1 * *'

jobs:
  update-flake-lock:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.UPDATE_APP_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: $/.github/actions/install-nix

      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-msg: "chore: update flake.lock (monthly)"
          pr-title: "chore: update flake.lock (monthly)"
          pr-labels: |
            dependencies
            automated
          branch: auto-update-flake-lock
          base: develop
