name: Update Flake Lock

on:
  workflow_dispatch:
  # TODO: enable scheduled updates when nixpkgs is updated.
  # schedule:
  #   - cron: '0 0 1 * *'

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.UPDATE_APP_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: $/.github/actions/nix-install-ephemeral

      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-msg: "chore: update flake.lock (monthly)"
          pr-title: "chore: update flake.lock (monthly)"
          pr-labels: |
            dependencies
            automated
          branch: auto-update-flake-lock
          base: develop
