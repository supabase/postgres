name: Test Database
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The schema is verified by the schema-<version> nix checks (see nix/checks.nix), which only run
  # when their inputs change. This job is a no-op that keeps the "schema / verify (<version>)"
  # status checks reporting for as long as the develop branch protection requires them.
  verify:
    strategy:
      matrix:
        postgres_major_version: ["15", "17", "orioledb-17"]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Nothing to do, see the schema-${{ matrix.postgres_major_version }} nix check
        run: exit 0
