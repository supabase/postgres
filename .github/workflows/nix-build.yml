name: CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write
  # version-diff downloads the base commit's drvPaths from its merge queue run
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Install nix
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      - name: Push flake inputs to binary cache
        continue-on-error: true
        run: |
          set -euo pipefail
          script=
          for dir in /etc/nix "$HOME/.config/nix"; do
            if [[ -x $dir/upload-to-cache.sh ]]; then
              script=$dir/upload-to-cache.sh
              break
            fi
          done
          if [[ -z $script ]]; then
            exit 0
          fi
          cmd=()
          if [[ ! -O $script ]]; then
            cmd=(sudo -H)
          fi
          # xargs appends the store paths as args; the script reads them space-separated from OUT_PATHS
          # shellcheck disable=SC2016
          cmd+=(bash -c 'OUT_PATHS=$* exec "$0"' "$script")
          nix flake archive --json \
            | jq -r '.inputs | .. | .path? // empty' \
            | sort -u \
            | xargs --no-run-if-empty "${cmd[@]}"

      - name: Generate Build Matrix
        id: gen-matrix
        run: |
          nix run .#github-matrix -- --eval-output=eval.json checks legacyPackages
          echo eval.json:
          jq -S . eval.json
          nix run .#github-matrix -- --eval-input checks legacyPackages <eval.json

      - name: Extract drvPaths for version-diff
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          mkdir -p /tmp/drvpaths
          for system in x86_64-linux aarch64-linux; do
            jq -s --arg sys "$system" '
              [ .[]
                | select(has("drvPath"))
                | select(.attr | startswith("legacyPackages.\($sys)."))
                | {key: (.attr | ltrimstr("legacyPackages.\($sys).")), value: .drvPath} ]
              | from_entries' eval.json > "/tmp/drvpaths/$system.json"
          done

      - name: Upload drvPaths artifact
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: drvpaths
          path: /tmp/drvpaths/*.json
          retention-days: ${{ github.event_name == 'merge_group' && 90 || 1 }}

  builds-aarch64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-aarch64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-aarch64-linux
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  builds-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_darwin != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_darwin }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-aarch64-darwin
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_darwin != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_darwin }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  builds-x86_64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).x86_64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).x86_64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-x86_64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-x86_64-linux
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).x86_64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).x86_64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@v7.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/install-nix
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: $/.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks:
    name: Checks ✅
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - checks-aarch64-darwin
      - checks-aarch64-linux
      - checks-x86_64-linux
    # must always run, otherwise if any of the needs fail then this is skipped and PR is allowed through
    # not sure what GH's thinking is there that skipped == passed for the branch protection rule...
    # insert Mr Incredible meme -> pass is pass, skipped is not passed, PR should not merge
    if: always()
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  amis:
    needs:
      - builds-aarch64-linux
      - builds-x86_64-linux
    uses: $/.github/workflows/testinfra-ami-build.yml
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  # TODO: remove together with test.yml once the "schema / verify (...)" required status checks
  # are gone from the develop branch protection, the schema-<version> nix checks replaced it
  schema:
    uses: $/.github/workflows/test.yml

  containers:
    needs: builds-aarch64-linux
    uses: $/.github/workflows/docker-image-test.yml
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  qemu:
    needs: builds-aarch64-linux
    uses: $/.github/workflows/qemu-image-build.yml

  check:
    name: CI ✅
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - amis
      - checks
      - containers
      - qemu
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  version-diff:
    name: Package version diff
    if: github.event_name == 'pull_request'
    needs:
      - eval
      - builds-x86_64-linux
      - builds-aarch64-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs_on: blacksmith-32vcpu-ubuntu-2404
          - system: aarch64-linux
            runs_on: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install nix
        uses: $/.github/actions/install-nix

      - name: Download head drvPaths
        uses: actions/download-artifact@v8.0.2
        with:
          name: drvpaths
          path: /tmp/head-drvpaths

      - name: Diff versions with nvd
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYSTEM: ${{ matrix.system }}
        run: |
          # BASE side comes from the merge queue run that evaluated the base commit
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nix-build.yml --event merge_group --commit "$BASE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -n $run_id ]] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name drvpaths --dir /tmp/base-drvpaths; then
            ./head/ci/version-diff/diff.sh "$SYSTEM"
          else
            echo "Baseline unavailable for \`${BASE_SHA:0:9}\`, version diff skipped (no successful merge queue run, or it expired)." >/tmp/diff.txt
          fi

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diff-${{ matrix.system }}
          path: /tmp/diff.txt
          retention-days: 7

  version-diff-comment:
    name: Post package version diff comment
    if: always() && github.event_name == 'pull_request'
    needs: version-diff
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Download diff artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: diff-*
          path: diffs
          merge-multiple: false

      - name: Assemble collapsed comment body
        run: ./ci/version-diff/comment.sh

      - name: Find existing version diff comment
        uses: peter-evans/find-comment@v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- version-diff -->"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/comment.md
          edit-mode: replace
