name: CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write
  pull-requests: write
  # version-diff downloads the base commit's drvPaths from its merge queue run
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aarch64-darwin:
    name: 🍎arm
    uses: $/.github/workflows/nix-ci-per-system.yml
    with:
      system: aarch64-darwin
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  aarch64-linux:
    name: 🐧arm
    uses: $/.github/workflows/nix-ci-per-system.yml
    with:
      system: aarch64-linux
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  x86_64-linux:
    name: 🐧x86
    uses: $/.github/workflows/nix-ci-per-system.yml
    with:
      system: x86_64-linux
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  check:
    name: CI ✅
    # must always run, otherwise if any of the needs fail then this is skipped and PR is allowed through
    # not sure what GH's thinking is there that skipped == passed for the branch protection rule...
    # insert Mr Incredible meme -> pass is pass, skipped is not passed, PR should not merge
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - aarch64-darwin
      - aarch64-linux
      - x86_64-linux
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  version-diff-comment:
    name: 📦Post version diff comment
    if: always() && github.event_name == 'pull_request'
    needs:
      - x86_64-linux
      - aarch64-linux
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Download diff artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: diff-*
          path: diffs
          merge-multiple: false

      - name: Assemble collapsed comment body
        run: ./ci/version-diff/comment.sh

      - name: Find existing version diff comment
        uses: peter-evans/find-comment@v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- version-diff -->"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/comment.md
          edit-mode: replace
