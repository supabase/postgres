name: Nix CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  

  eval-15-aarch64-darwin:
    name: Nix Eval (15, aarch64-darwin)
    runs-on: blacksmith-12vcpu-macos-26
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          installer: determinate
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      - name: Evaluate flake (parallel)
        run: |
          set -Eeu -o pipefail
          ./scripts/parallel-nix-eval-jobs.sh 15 | tee jobs.jsonl

      - name: Generate Nix Matrix
        id: gen-matrix
        run: |
          set -Eeu -o pipefail
          nix run .#github-matrix -- aarch64-darwin <jobs.jsonl | tee matrix.json
          echo "packages_matrix=$(jq -c .packages matrix.json)" >>"$GITHUB_OUTPUT"
          echo "checks_matrix=$(jq -c .checks matrix.json)" >>"$GITHUB_OUTPUT"

  builds-15-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval-15-aarch64-darwin
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval-15-aarch64-darwin.outputs.packages_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix (ephemeral)
        if: ${{ matrix.attr != '' && matrix.runs_on.group != 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: Install nix (self-hosted)
        if: ${{ matrix.attr != '' && matrix.runs_on.group == 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-self-hosted
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-15-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval-15-aarch64-darwin
      - builds-15-aarch64-darwin
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
