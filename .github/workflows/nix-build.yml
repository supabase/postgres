name: Nix CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix-eval-x86_64-linux:
    name: Nix Eval (x86_64-linux)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          installer: determinate
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      - name: Evaluate flake (parallel)
        run: |
          set -Eeu -o pipefail
          ./scripts/parallel-nix-eval-jobs.sh | tee jobs.jsonl

      - name: Generate Nix Matrix
        id: gen-matrix
        run: |
          set -Eeu -o pipefail
          nix run .#github-matrix -- --stdout <jobs.jsonl | tee matrix.json
          echo "packages_matrix=$(jq -c .packages.x86_64_linux matrix.json)" >>"$GITHUB_OUTPUT"
          echo "checks_matrix=$(jq -c .checks.x86_64_linux matrix.json)" >>"$GITHUB_OUTPUT"

  nix-eval-aarch64-linux:
    name: Nix Eval (aarch64-linux)
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          installer: determinate
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      - name: Evaluate flake (parallel)
        run: |
          set -Eeu -o pipefail
          ./scripts/parallel-nix-eval-jobs.sh | tee jobs.jsonl

      - name: Generate Nix Matrix
        id: gen-matrix
        run: |
          set -Eeu -o pipefail
          nix run .#github-matrix -- --stdout <jobs.jsonl | tee matrix.json
          echo "packages_matrix=$(jq -c .packages.aarch64_linux matrix.json)" >>"$GITHUB_OUTPUT"
          echo "checks_matrix=$(jq -c .checks.aarch64_linux matrix.json)" >>"$GITHUB_OUTPUT"

  nix-eval-aarch64-darwin:
    name: Nix Eval (aarch64-darwin)
    runs-on: blacksmith-12vcpu-macos-26
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          installer: determinate
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      - name: Evaluate flake (parallel)
        run: |
          set -Eeu -o pipefail
          ./scripts/parallel-nix-eval-jobs.sh | tee jobs.jsonl

      - name: Generate Nix Matrix
        id: gen-matrix
        run: |
          set -Eeu -o pipefail
          nix run .#github-matrix -- --stdout <jobs.jsonl | tee matrix.json
          echo "packages_matrix=$(jq -c .packages.aarch64_darwin matrix.json)" >>"$GITHUB_OUTPUT"
          echo "checks_matrix=$(jq -c .checks.aarch64_darwin matrix.json)" >>"$GITHUB_OUTPUT"

  nix-build-packages-aarch64-linux:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (aarch64-linux)
    needs: nix-eval-aarch64-linux
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-aarch64-linux.outputs.packages_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-checks-aarch64-linux:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (aarch64-linux)
    needs:
      - nix-eval-aarch64-linux
      - nix-build-packages-aarch64-linux
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-aarch64-linux.outputs.checks_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-packages-aarch64-darwin:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (aarch64-darwin)
    needs: nix-eval-aarch64-darwin
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-aarch64-darwin.outputs.packages_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix (ephemeral)
        if: ${{ matrix.attr != '' && matrix.runs_on.group != 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: Install nix (self-hosted)
        if: ${{ matrix.attr != '' && matrix.runs_on.group == 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-self-hosted
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-checks-aarch64-darwin:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (aarch64-darwin)
    needs:
      - nix-eval-aarch64-darwin
      - nix-build-packages-aarch64-darwin
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-aarch64-darwin.outputs.checks_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-packages-x86_64-linux:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (x86_64-linux)
    needs: nix-eval-x86_64-linux
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-x86_64-linux.outputs.packages_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-checks-x86_64-linux:
    name: >-
      ${{ matrix.name }}${{ matrix.postgresql_version && format(' - Postgres {0}', matrix.postgresql_version) || '' }}
      (x86_64-linux)
    needs:
      - nix-eval-x86_64-linux
      - nix-build-packages-x86_64-linux
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.nix-eval-x86_64-linux.outputs.checks_matrix) }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  nix-build-checks:
    name: Nix Checks ✅
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - nix-build-checks-aarch64-darwin
      - nix-build-checks-aarch64-linux
      - nix-build-checks-x86_64-linux
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  run-testinfra-aarch64-linux:
    needs: nix-build-packages-aarch64-linux
    uses: ./.github/workflows/testinfra-ami-build.yml
    with:
      arch: arm64
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  run-testinfra-x86_64-linux:
    needs: nix-build-packages-x86_64-linux
    uses: ./.github/workflows/testinfra-ami-build.yml
    with:
      arch: amd64
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  report-disk-usage:
    needs:
      - run-testinfra-aarch64-linux
      - run-testinfra-x86_64-linux
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Download AMI disk usage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ami-disk-usage-*
          path: ami-disk-usage
          merge-multiple: true

      - name: Report AMI disk usage
        run: |
          cat <<EOF >>"$GITHUB_STEP_SUMMARY"
          ### AMI Root Disk Usage

          | Version | Arch | Human | Bytes |
          | ------- | ---- | ----- | ----- |
          EOF
          cat ami-disk-usage/ami-disk-usage-*.json |
          sort -V |
          jq -rs '.[]|{version,arch,human,bytes}|"| \(join("|")) |"' >>"$GITHUB_STEP_SUMMARY"

  run-tests-aarch64-linux:
    needs: nix-build-packages-aarch64-linux
    uses: ./.github/workflows/test.yml
    with:
      arch: arm64

  run-tests-x86_64-linux:
    needs: nix-build-packages-x86_64-linux
    uses: ./.github/workflows/test.yml
    with:
      arch: amd64

  docker-image-test:
    needs: nix-build-packages-aarch64-linux
    uses: ./.github/workflows/docker-image-test.yml
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  nix-ci-check:
    name: Nix CI ✅
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - docker-image-test
      - nix-build-checks
      - report-disk-usage
      - run-testinfra-aarch64-linux
      - run-testinfra-x86_64-linux
      - run-tests-aarch64-linux
      - run-tests-x86_64-linux
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1
