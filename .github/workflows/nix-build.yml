name: CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write
  # version-diff downloads the base commit's drvPaths from its merge queue run
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Temporary benchmark: times the eval job's nix-eval-jobs run, and logs when each attribute finishes.
  # The "all" row evaluates every system in one run, like the eval job does today.
  # The other rows evaluate one system each, on their own runner, to see whether splitting eval by system is faster.
  # This replaces every other CI job, so this commit must not be merged.
  eval-bench:
    name: eval-bench (${{ matrix.system }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        system:
          - all
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Install nix
        uses: $/.github/actions/install-nix
        with:
          single-user: true

      # Build the tools first so their build time is not part of the measurement.
      - name: Build nix-eval-jobs and hyperfine
        run: |
          set -euo pipefail
          echo "NIX_EVAL_JOBS=$(nix build --no-link --print-out-paths github:nix-community/nix-eval-jobs/v2.35.4)/bin/nix-eval-jobs" >>"$GITHUB_ENV"
          echo "HYPERFINE=$(nix build --no-link --print-out-paths nixpkgs#hyperfine)/bin/hyperfine" >>"$GITHUB_ENV"

      - name: Time eval
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          # Pick the flake outputs to evaluate: every system, or only this row's system.
          # Attribute names come out the same either way, for example checks.x86_64-linux.foo.
          if [[ $SYSTEM == all ]]; then
            select='outputs: { inherit (outputs) checks legacyPackages; }'
          else
            select="outputs: { checks.$SYSTEM = outputs.checks.$SYSTEM; legacyPackages.$SYSTEM = outputs.legacyPackages.$SYSTEM; }"
          fi

          # These are the flags github-matrix passes, so the work matches the real eval job.
          # Extra flags given to eval.sh are added to them.
          # The full output goes to eval.json, and each attribute name goes to the log.
          # GitHub timestamps every log line, so the log shows when each attribute was printed.
          cat >eval.sh <<EOF
          set -euo pipefail
          "$NIX_EVAL_JOBS" \
            --flake . \
            --force-recurse \
            --option eval-cache false \
            --option accept-flake-config true \
            --max-memory-size 3072 \
            --workers 32 \
            --select '$select' \
            "\$@" \
            | tee eval.json \
            | jq --unbuffered -r '.attr'
          EOF

          # Before each run, finish pending disk writes, drop the page cache, and clear the narinfo cache.
          # Otherwise a run can be slowed by writes left over from the run before it, or sped up by files still in memory.
          prepare='sync && echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null && rm -rf ~/.cache/nix'

          # With --check-cache-status, finished jobs wait for batched binary cache lookups on one thread before they are printed.
          # So only the run without it shows when each attribute finished evaluating.
          # The gap between the two also shows what the cache check costs.
          # The first command runs first, so its run 1 is the only one that starts with an empty store.
          "$HYPERFINE" \
            --shell bash \
            --show-output \
            --prepare "$prepare" \
            --export-json hyperfine.json \
            -n with-cache-check 'bash eval.sh --check-cache-status' \
            -n without-cache-check 'bash eval.sh'

          # The job and error counts show that every run evaluated the same attributes.
          jobs=$(wc -l <eval.json)
          errors=$(grep -c '"error"' eval.json || true)

          {
            echo "## eval-bench results: $SYSTEM"
            echo
            echo "hyperfine ran each variant several times on the same runner."
            echo "Only the first run of with-cache-check starts with an empty store; every later run reuses it."
            echo
            echo "| Variant | Run 1, empty store | Later runs, mean | Later runs, min | Later runs, max | Jobs | Errors |"
            echo "|---|---|---|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"

          # hyperfine's JSON keeps the command line, not the -n name, so name the variants by position.
          variants=(with-cache-check without-cache-check)
          for i in 0 1; do
            # Wall time of each run in seconds, in run order (hyperfine 2.x JSON format).
            times="[.results[$i].measurements[].time_wall_clock.value]"
            if [[ $i == 0 ]]; then
              cold=$(jq "$times | .[0] * 10 | round / 10" hyperfine.json)s
            else
              cold="n/a (store already warm)"
            fi
            jq -r --arg variant "${variants[$i]}" --arg cold "$cold" --arg jobs "$jobs" --arg errors "$errors" \
              "$times | .[1:] as \$warm
                | [\$variant, \$cold,
                   ((\$warm | add / length * 10 | round / 10 | tostring) + \"s\"),
                   ((\$warm | min * 10 | round / 10 | tostring) + \"s\"),
                   ((\$warm | max * 10 | round / 10 | tostring) + \"s\"),
                   \$jobs, \$errors]
                | \"| \" + join(\" | \") + \" |\"" \
              hyperfine.json >>"$GITHUB_STEP_SUMMARY"
          done
