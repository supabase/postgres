name: Nix CI

on:
  push:
    branches:
      - release/*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  # required by testinfra-ami-build dependent workflows
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      packages_matrix: ${{ steps.gen-matrix.outputs.packages_matrix }}
      checks_matrix: ${{ steps.gen-matrix.outputs.checks_matrix }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}

      # shared with version-diff's HEAD side
      - name: Evaluate drvPaths for version-diff
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/drvpaths
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix eval --impure --json --accept-flake-config \
              --expr "(import $PWD/ci/version-diff/drvpaths.nix { dir = toString ./.; system = \"$system\"; })" \
              > "/tmp/drvpaths/$system.json"
          done

      - name: Upload drvPaths artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: head-drvpaths
          path: /tmp/drvpaths/*.json
          retention-days: 1

      - name: Generate Nix Matrix
        id: gen-matrix
        run: |
          nix run .#github-matrix -- --eval-output=eval.json checks legacyPackages
          echo eval.json:
          jq -S . eval.json
          nix run .#github-matrix -- --eval-input checks legacyPackages <eval.json

  builds-aarch64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-aarch64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-aarch64-linux
    runs-on: ${{ matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  builds-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_darwin != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).aarch64_darwin }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix (ephemeral)
        if: ${{ matrix.attr != '' && matrix.runs_on.group != 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: Install nix (self-hosted)
        if: ${{ matrix.attr != '' && matrix.runs_on.group == 'self-hosted-runners-nix' }}
        uses: ./.github/actions/nix-install-self-hosted
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-aarch64-darwin:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-aarch64-darwin
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_darwin != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).aarch64_darwin }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  builds-x86_64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs: eval
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.packages_matrix).x86_64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.packages_matrix).x86_64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks-x86_64-linux:
    name: ${{ matrix.name }}${{ matrix.postgresql_version || '' }}
    needs:
      - eval
      - builds-x86_64-linux
    runs-on: ${{ matrix.attr != '' && matrix.runs_on.group && matrix.runs_on || matrix.runs_on.labels }}
    if: ${{ fromJSON(needs.eval.outputs.checks_matrix).x86_64_linux != null }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix: ${{ fromJSON(needs.eval.outputs.checks_matrix).x86_64_linux }}
    steps:
      - name: Checkout Repo
        if: ${{ matrix.attr != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install nix
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: true
          nix-signing-key: ${{ secrets.NIX_SIGN_SECRET_KEY }}
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
      - name: nix build
        if: ${{ matrix.attr != '' }}
        uses: ./.github/actions/nix-build-retry
        with:
          attr: .#${{ matrix.attr }}

  checks:
    name: Nix Checks ✅
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - checks-aarch64-darwin
      - checks-aarch64-linux
      - checks-x86_64-linux
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  amis:
    needs:
      - builds-aarch64-linux
      - builds-x86_64-linux
    uses: ./.github/workflows/testinfra-ami-build.yml
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  schema:
    needs:
      - builds-aarch64-linux
      - builds-x86_64-linux
    uses: ./.github/workflows/test.yml

  containers:
    needs: builds-aarch64-linux
    uses: ./.github/workflows/docker-image-test.yml
    secrets:
      DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
      NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

  check:
    name: Nix CI ✅
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - amis
      - checks
      - containers
      - schema
    steps:
      - name: Check dependent job results
        if: contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped')
        run: |
          jq -rn --argjson needs '${{ toJSON(needs) }}' '$needs|to_entries[]|select(.value.result!="success")|"::error::"+.key+": "+.value.result'
          exit 1

  version-diff:
    name: Package version diff
    if: github.event_name == 'pull_request'
    needs:
      - eval
      - builds-x86_64-linux
      - builds-aarch64-linux
      - builds-aarch64-darwin
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs_on: blacksmith-32vcpu-ubuntu-2404
            installer: ephemeral
          - system: aarch64-linux
            runs_on: blacksmith-4vcpu-ubuntu-2404-arm
            installer: ephemeral
          - system: aarch64-darwin
            runs_on:
              group: self-hosted-runners-nix
              labels: [aarch64-darwin]
            installer: self-hosted
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install nix (ephemeral)
        if: matrix.installer == 'ephemeral'
        uses: ./head/.github/actions/nix-install-ephemeral

      - name: Install nix (self-hosted)
        if: matrix.installer == 'self-hosted'
        uses: ./head/.github/actions/nix-install-self-hosted

      # HEAD side already done in eval
      - name: Download head drvPaths
        uses: actions/download-artifact@v4
        with:
          name: head-drvpaths
          path: /tmp/head-drvpaths

      # use HEAD's script, base may predate it
      - name: Evaluate base drvPaths
        working-directory: base
        run: |
          nix eval --impure --json --accept-flake-config \
            --expr '(import ${{ github.workspace }}/head/ci/version-diff/drvpaths.nix { dir = toString ./.; system = "${{ matrix.system }}"; })' \
            > /tmp/base-drvpaths.json

      - name: Diff versions with nvd
        run: ./head/ci/version-diff/diff.sh "${{ matrix.system }}"

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff-${{ matrix.system }}
          path: /tmp/diff.txt
          retention-days: 7

  version-diff-comment:
    name: Post package version diff comment
    if: always() && github.event_name == 'pull_request'
    needs: version-diff
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Download diff artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          path: diffs
          merge-multiple: false

      - name: Assemble collapsed comment body
        run: ./ci/version-diff/comment.sh

      - name: Find existing version diff comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- version-diff -->"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/comment.md
          edit-mode: replace
