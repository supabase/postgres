name: Release AMI Nix

on:
  push:
    branches:
      - develop
      - release/*
    paths:
      - '.github/workflows/ami-release-nix.yml'
      - 'common-nix.vars.pkr.hcl'
      - 'ansible/vars.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      postgres_versions: ${{ steps.set-versions.outputs.postgres_versions }}
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD

      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral

      - name: Set PostgreSQL versions
        id: set-versions
        run: |
          VERSIONS=$(nix run nixpkgs#yq-go -- -o=json -I=0 '.postgres_major' ansible/vars.yml)
          echo "postgres_versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ${{ fromJson(needs.prepare.outputs.postgres_versions) }}
        target:
          - arch: arm64
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            packer_template: amazon-arm64-nix.pkr.hcl
            vars_file: development-arm64.vars.pkr.hcl
            instance_type: c6g.4xlarge
            nix_system: aarch64-linux
            ami_arch_filter: arm64
          - arch: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
            packer_template: amazon-amd64-nix.pkr.hcl
            vars_file: development-amd64.vars.pkr.hcl
            instance_type: c6i.4xlarge
            nix_system: x86_64-linux
            ami_arch_filter: x86_64
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 150

    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD

      - name: aws-creds
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
          aws-region: "us-east-1"
          output-credentials: true
          role-duration-seconds: 7200

      - name: Install nix
        uses: ./.github/actions/nix-install-ephemeral
        with:
          push-to-cache: 'true'
        env:
          DEV_AWS_ROLE: ${{ secrets.DEV_AWS_ROLE }}
          NIX_SIGN_SECRET_KEY: ${{ secrets.NIX_SIGN_SECRET_KEY }}

      - name: Setup pre build env vars
        run: |
          echo "POSTGRES_MAJOR_VERSION=${{ matrix.postgres_version }}" >> "$GITHUB_ENV"
          echo "PACKER_EXECUTION_ID=${{ github.run_id }}-${{ matrix.postgres_version }}-${{ matrix.arch.name }}" >> "$GITHUB_ENV"

      - name: Generate common-nix.vars.pkr.hcl
        run: |
          POSTGRES_SUPABASE_VERSION="$(nix run nixpkgs#yq-go -- -r '.postgres_release["postgres'"$POSTGRES_MAJOR_VERSION"'"]' ansible/vars.yml)"
          echo "postgres-version = \"$POSTGRES_SUPABASE_VERSION\"" > common-nix.vars.pkr.hcl

      - name: Build AMI stage 1
        run: |
          GIT_SHA=${{github.sha}}

          nix run github:supabase/postgres/${GIT_SHA}#packer -- init ${{ matrix.arch.packer_template }}
          nix run github:supabase/postgres/${GIT_SHA}#packer -- build -var "git-head-version=${GIT_SHA}" -var "packer-execution-id=${PACKER_EXECUTION_ID}" -var-file="${{ matrix.arch.vars_file }}" -var-file="common-nix.vars.pkr.hcl" -var "ansible_arguments=-e postgresql_major=${POSTGRES_MAJOR_VERSION}" -var "region=us-east-1" -var 'ami_regions=["us-east-1"]' -var "ami_name=supabase-postgres-${{ matrix.arch.ami_arch_filter }}" ${{ matrix.arch.packer_template }}

      - name: Find stage 1 AMI
        run: |
          GIT_SHA=${{github.sha}}
          REGION="us-east-1"

          echo "Looking for stage 1 AMI with postgresVersion=${POSTGRES_SUPABASE_VERSION}-stage1 and sourceSha=${GIT_SHA} in region ${REGION}"

          STAGE1_AMI_ID=$(aws ec2 describe-images \
            --region "$REGION" \
            --owners self \
            --filters \
              "Name=tag:postgresVersion,Values=${POSTGRES_SUPABASE_VERSION}-stage1" \
              "Name=tag:sourceSha,Values=${GIT_SHA}" \
              "Name=state,Values=available" \
              "Name=architecture,Values=${{ matrix.arch.ami_arch_filter }}" \
            --query 'Images[0].ImageId' \
            --output text)

          if [ -z "$STAGE1_AMI_ID" ] || [ "$STAGE1_AMI_ID" = "None" ]; then
            echo "ERROR: Failed to find stage 1 AMI"
            exit 1
          fi

          echo "Found stage 1 AMI: $STAGE1_AMI_ID"
          echo "STAGE1_AMI_ID=$STAGE1_AMI_ID" >> "$GITHUB_ENV"

      - name: Build AMI stage 2
        run: |
          GIT_SHA=${{github.sha}}
          nix run github:supabase/postgres/${GIT_SHA}#packer -- init stage2-nix-psql.pkr.hcl
          nix run github:supabase/postgres/${GIT_SHA}#packer -- build -var "git_sha=${GIT_SHA}" -var "git-head-version=${GIT_SHA}" -var "packer-execution-id=${PACKER_EXECUTION_ID}" -var "postgres_major_version=${POSTGRES_MAJOR_VERSION}" -var "source_ami=${STAGE1_AMI_ID}" -var-file="${{ matrix.arch.vars_file }}" -var-file="common-nix.vars.pkr.hcl" -var "region=us-east-1" -var "instance_type=${{ matrix.arch.instance_type }}" -var "ami_name=supabase-postgres-${{ matrix.arch.ami_arch_filter }}" stage2-nix-psql.pkr.hcl

          echo "::notice title=AMI Published::Postgres AMI version: $POSTGRES_SUPABASE_VERSION"

      - name: Setup post build env vars
        run: |
          if [ "${{ matrix.target.arch }}" = "amd64" ]; then
            {
              echo "ARCH_SUFFIX=-x86"
              echo "RELEASE_TAG=${POSTGRES_SUPABASE_VERSION}-x86"
            } >>"$GITHUB_ENV"
          else
            {
              echo "ARCH_SUFFIX="
              echo "RELEASE_TAG=${POSTGRES_SUPABASE_VERSION}"
            } >>"$GITHUB_ENV"
          fi

      - name: Create nix flake revision tarball
        run: |
          GIT_SHA=${{github.sha}}

          mkdir -p "/tmp/pg_upgrade_bin/${POSTGRES_MAJOR_VERSION}"
          echo "$GIT_SHA" >> "/tmp/pg_upgrade_bin/${POSTGRES_MAJOR_VERSION}/nix_flake_version"
          tar -czf "/tmp/pg_binaries.tar.gz" -C "/tmp/pg_upgrade_bin" .

      - name: configure aws credentials - staging
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
          aws-region: "us-east-1"

      - name: Upload software manifest to s3 staging
        run: |
          cd ansible
          ansible-playbook -i localhost \
            -e "ami_release_version=$POSTGRES_SUPABASE_VERSION" \
            -e "internal_artifacts_bucket=${{ secrets.ARTIFACTS_BUCKET }}" \
            -e "postgres_major_version=$POSTGRES_MAJOR_VERSION" \
            -e "arch=${{ matrix.target.arch }}" \
            manifest-playbook.yml

      - name: Upload nix flake revision to s3 staging
        run: |
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/20.04.tar.gz"
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/24.04.tar.gz"
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/upgrade_bundle.tar.gz"

      - name: configure aws credentials - prod
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE }}
          aws-region: "us-east-1"

      - name: Upload software manifest to s3 prod
        run: |
          cd ansible
          ansible-playbook -i localhost \
            -e "ami_release_version=$POSTGRES_SUPABASE_VERSION" \
            -e "internal_artifacts_bucket=${{ secrets.PROD_ARTIFACTS_BUCKET }}" \
            -e "postgres_major_version=$POSTGRES_MAJOR_VERSION" \
            -e "arch=${{ matrix.target.arch }}" \
            manifest-playbook.yml

      - name: Upload nix flake revision to s3 prod
        run: |
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.PROD_ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/20.04.tar.gz"
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.PROD_ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/24.04.tar.gz"
          aws s3 cp /tmp/pg_binaries.tar.gz "s3://${{ secrets.PROD_ARTIFACTS_BUCKET }}/upgrades$ARCH_SUFFIX/postgres/supabase-postgres-$POSTGRES_SUPABASE_VERSION/upgrade_bundle.tar.gz"

      - name: GitHub OIDC Auth
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::279559813984:role/supabase-github-oidc-role
          role-session-name: shared-services-jump

      - name: Assume destination role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::279559813984:role/supabase-nix-catalog-artifacts-role-6387512
          role-skip-session-tagging: true
          role-session-name: upload-assets
          role-chaining: true

      - name: Update nix store path catalog
        run: |
          GIT_SHA="${{ github.sha }}"
          SYSTEM="${{ matrix.target.nix_system }}"

          # Get store path for this build
          STORE_PATH=$(nix eval --raw ".#psql_${POSTGRES_MAJOR_VERSION}/bin.outPath")

          # Each postgres version gets its own catalog file (no race conditions)
          CATALOG_S3="s3://${{ secrets.SHARED_AWS_ARTIFACTS_BUCKET }}/nix-catalog/${GIT_SHA}-psql_${POSTGRES_MAJOR_VERSION}-${SYSTEM}.json"

          # Create catalog JSON for this version
          jq -n \
             --arg ver "$POSTGRES_SUPABASE_VERSION" \
             --arg sha "$GIT_SHA" \
             --arg sys "$SYSTEM" \
             --arg path "$STORE_PATH" \
             '{version: $ver, git_sha: $sha, ($sys): $path}' > /tmp/catalog.json

          echo "Catalog for psql_${POSTGRES_MAJOR_VERSION}:"
          cat /tmp/catalog.json

          # Upload catalog
          aws s3 cp /tmp/catalog.json "$CATALOG_S3" \
            --content-type "application/json"

          echo "Catalog uploaded to ${CATALOG_S3}"

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}

      - name: Create CLI tag for PG 17
        if: matrix.postgres_version == '17' && matrix.target.arch == 'arm64' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLI_TAG="v${POSTGRES_SUPABASE_VERSION}-cli"
          echo "Creating CLI tag: ${CLI_TAG}"
          git tag "${CLI_TAG}" "${{ github.sha }}"
          git push origin "${CLI_TAG}"

      - name: Trigger CLI release workflow for PG 17
        if: matrix.postgres_version == '17' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLI_TAG="v${POSTGRES_SUPABASE_VERSION}-cli"
          gh workflow run cli-release.yml \
            --ref "${CLI_TAG}" \
            -f version="${CLI_TAG}"

      - name: Trigger pg_upgrade_scripts workflow
        if: matrix.target.arch == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-nix-pgupgrade-scripts.yml \
            --ref "${{ github.ref_name }}" \
            -f postgresVersion="$POSTGRES_SUPABASE_VERSION"

      - name: Trigger pg_upgrade_bin flake version workflow
        if: matrix.target.arch == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-nix-pgupgrade-bin-flake-version.yml \
            --ref "${{ github.ref_name }}" \
            -f postgresVersion="$POSTGRES_SUPABASE_VERSION"

      - name: Slack Notification on Failure
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK }}
          SLACK_USERNAME: 'gha-failures-notifier'
          SLACK_COLOR: 'danger'
          SLACK_MESSAGE: 'Building Postgres AMI failed'
          SLACK_FOOTER: ''

      - name: configure aws credentials for cleanup
        if: ${{ always() }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE }}
          aws-region: "us-east-1"

      - name: Cleanup resources after build
        if: ${{ always() }}
        run: |
          aws ec2 --region us-east-1 describe-instances --filters "Name=tag:packerExecutionId,Values=${PACKER_EXECUTION_ID}" --query "Reservations[].Instances[].InstanceId" --output text | xargs -r aws ec2 terminate-instances --region us-east-1 --instance-ids
          aws ec2 --region us-east-1 describe-volumes --filters "Name=tag:packerExecutionId,Values=${PACKER_EXECUTION_ID}" "Name=status,Values=available" --query "Volumes[*].VolumeId" --output text | xargs -r -n1 aws ec2 --region us-east-1 delete-volume --volume-id

      - name: Cleanup resources on build cancellation
        if: ${{ cancelled() }}
        run: |
          aws ec2 --region us-east-1 describe-instances --filters "Name=tag:packerExecutionId,Values=${PACKER_EXECUTION_ID}" --query "Reservations[].Instances[].InstanceId" --output text | xargs -r aws ec2 terminate-instances --region us-east-1 --instance-ids
          aws ec2 --region us-east-1 describe-volumes --filters "Name=tag:packerExecutionId,Values=${PACKER_EXECUTION_ID}" "Name=status,Values=available" --query "Volumes[*].VolumeId" --output text | xargs -r -n1 aws ec2 --region us-east-1 delete-volume --volume-id
