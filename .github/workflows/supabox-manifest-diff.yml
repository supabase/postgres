# Rootfs manifest diff: this PR's AMI vs develop's, via supabox's
# tag:manifest suite (supabase/supabox#216). Draft: manual dispatch
# only until validated. See MPG-117 / "RFC: declarative system
# management".
#
# baseline/pr run sequentially, not in parallel: e2e.yml's Blacksmith
# build cache is a single sticky disk keyed only by profiles+latest
# (supabase/supabox#214), not by repo pin, so two same-flavor builds
# racing in parallel would clobber each other's cache (the exact bug
# #214 fixed for the periodic/PR builds).
name: Supabox manifest diff (draft)

on:
  workflow_dispatch:
  # TODO: enable once tag:manifest lands in supabox and this is validated manually
  #pull_request:
  #  branches: [develop]

# One sticky disk, shared by every PR's baseline+pr build (same profile
# flavor, e2e.yml's own concurrency group is per-run_id for
# workflow_call and won't catch this). Queue concurrent PRs rather
# than race them on the same cache; never cancel one PR's run for
# another's.
concurrency:
  group: supabox-manifest-diff-cache
  cancel-in-progress: false

jobs:
  baseline:
    uses: supabase/supabox/.github/workflows/e2e.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      filters: tag:manifest
      merge_json: '{"repos":{"postgres":{"pin":"develop"}}}'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SUPABOX_SB_SUPABOT_PRIVATE_KEY }}

  pr:
    needs: [baseline]
    uses: supabase/supabox/.github/workflows/e2e.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      filters: tag:manifest
      merge_json: '{"repos":{"postgres":{"pin":"${{ github.event.pull_request.head.sha || github.sha }}"}}}'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SUPABOX_SB_SUPABOT_PRIVATE_KEY }}

  diff:
    needs: [baseline, pr]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO: fetch both manifest artifacts, post diff as PR comment"
