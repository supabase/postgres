name: treefmt
on:
    pull_request:
    push:
        branches: develop
jobs:
    formatter:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
            - name: treefmt
              run: nix-shell -p treefmt nixpkgs-fmt --run "treefmt --ci"
