name: Mirror PostgREST

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/mirror-postgrest.yml"
      - "ansible/vars.yml"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      postgrest_release: ${{ steps.args.outputs.result }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - id: args
        uses: mikefarah/yq@v4.54.3
        with:
          cmd: yq '.postgrest_release' 'ansible/vars.yml'

  mirror:
    needs:
      - version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: supabase/cli/.github/workflows/mirror-image.yml@c3c7a586b11b6605358177efabbc1b1cb7589b23 # v3.2.0
    with:
      # PostgREST is mirrored to ECR with a -middleware suffix (also updated in cli-smoke-test.nix for the "rest-version")
      image: supabase/postgrest:v${{ needs.version.outputs.postgrest_release }}-middleware
    secrets: inherit
