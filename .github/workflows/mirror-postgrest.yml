name: Mirror PostgREST

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/mirror-postgrest.yml"
      - "ansible/vars.yml"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      postgrest_release: ${{ steps.args.outputs.result }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
      - id: args
        uses: mikefarah/yq@v4.54.3
        with:
          cmd: yq '.postgrest_release' 'ansible/vars.yml'

  mirror:
    needs:
      - version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: supabase/cli/.github/workflows/mirror-image.yml@d4fc0e5bbd65b3ade802e956d6df1cddab2e65a3 # v3.1.0
    with:
      image: supabase/postgrest:v${{ needs.version.outputs.postgrest_release }}-middleware
    secrets: inherit
