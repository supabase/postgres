name: Manual Docker Artifacts Release

on:
  workflow_dispatch:
    inputs:
      postgresVersion:
        description: 'Optional. Postgres version to publish against, i.e. 15.1.1.78'
        required: false
      imageLabel:
        description: 'Optional. Extra label appended to the image tag, e.g. a short SHA or test suffix (default: no suffix)'
        required: false
        default: ''
      dockerfiles:
        description: 'Which Dockerfiles to build. "legacy" uses Dockerfile-15/17/orioledb-17; "layered" uses Dockerfile-supabase + Dockerfile-multigres.'
        required: false
        default: 'legacy'
        type: choice
        options:
          - legacy
          - layered

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      matrix_config: ${{ steps.set-matrix.outputs.matrix_config }}
      base_matrix: ${{ steps.set-matrix.outputs.base_matrix }}
      layered_matrix: ${{ steps.set-matrix.outputs.layered_matrix }}
      use_layered: ${{ steps.set-matrix.outputs.use_layered }}
    steps:
      - uses: ./.github/actions/nix-install-ephemeral
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - name: Generate build matrix
        id: set-matrix
        env:
          DOCKERFILES_MODE: ${{ inputs.dockerfiles || 'legacy' }}
        run: |
          nix run nixpkgs#nushell -- -c '
          let releases = (open ansible/vars.yml | get postgres_release)
          let use_layered = ($env.DOCKERFILES_MODE == "layered")

          let base = if $use_layered {
            (open ansible/vars.yml | get release_matrix_base
              | each { |e| $e | insert tag ($releases | get $e.release_key) })
          } else {
            (open ansible/vars.yml | get release_matrix_legacy
              | each { |e| $e | insert tag ($releases | get $e.release_key) })
          }

          let layered = if $use_layered {
            (open ansible/vars.yml | get release_matrix_layered
              | each { |e|
                  let ver = ($releases | get $e.release_key)
                  $e | insert tag $"($ver)($e.tag_suffix)" | insert base_tag $ver
                })
          } else {
            []
          }

          let combined = ($base | append $layered)
          $"use_layered=($use_layered)" | save --append $env.GITHUB_OUTPUT
          $"base_matrix=({include: $base} | to json -r)" | save --append $env.GITHUB_OUTPUT
          $"layered_matrix=({include: $layered} | to json -r)" | save --append $env.GITHUB_OUTPUT
          $"matrix_config=({include: $combined} | to json -r)" | save --append $env.GITHUB_OUTPUT
          '
  build:
    needs: prepare
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_config) }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    outputs:
      build_args: ${{ steps.args.outputs.result }}
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - uses: ./.github/actions/nix-install-ephemeral
      - id: args
        run: |
          nix run nixpkgs#nushell -- -c '
            open ansible/vars.yml
            | items { |key value| {name: $key, item: $value} }
            | where { |it| ($it.item | describe) == "string" }
            | each { |it| $"($it.name)=($it.item)" }
            | str join "\n"
            | save --append $env.GITHUB_OUTPUT
          '
  build_base_images:
    needs: [prepare, build]
    strategy:
      matrix:
        postgres: ${{ fromJson(needs.prepare.outputs.base_matrix).include }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'blacksmith-8vcpu-ubuntu-2404' || 'large-linux-arm' }}
    timeout-minutes: 180
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - uses: ./.github/actions/nix-install-ephemeral
      - run: docker context create builders
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          endpoint: builders
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          push: true
          build-args: |
            ${{ needs.build.outputs.build_args }}
            PG_VERSION=${{ matrix.postgres.pg_version }}
          target: ${{ matrix.postgres.target }}
          tags: supabase/postgres:${{ inputs.postgresVersion || matrix.postgres.tag }}${{ inputs.imageLabel != '' && format('-{0}', inputs.imageLabel) || '' }}_${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ github.ref_name }}-latest-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-latest-${{ matrix.arch }}
          file: ${{ matrix.postgres.dockerfile }}

  build_layered_images:
    if: needs.prepare.outputs.use_layered == 'true'
    needs: [prepare, build, build_base_images]
    strategy:
      matrix:
        postgres: ${{ fromJson(needs.prepare.outputs.layered_matrix).include }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'blacksmith-8vcpu-ubuntu-2404' || 'large-linux-arm' }}
    timeout-minutes: 180
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - uses: ./.github/actions/nix-install-ephemeral
      - run: docker context create builders
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          endpoint: builders
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          push: true
          build-args: |
            ${{ needs.build.outputs.build_args }}
            PG_VERSION=${{ matrix.postgres.pg_version }}
            SUPABASE_IMAGE=supabase/postgres:${{ inputs.postgresVersion || matrix.postgres.base_tag }}${{ inputs.imageLabel != '' && format('-{0}', inputs.imageLabel) || '' }}_${{ matrix.arch }}
          target: ${{ matrix.postgres.target }}
          tags: supabase/postgres:${{ inputs.postgresVersion != '' && format('{0}-multigres', inputs.postgresVersion) || matrix.postgres.tag }}${{ inputs.imageLabel != '' && format('-{0}', inputs.imageLabel) || '' }}_${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ github.ref_name }}-latest-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-latest-${{ matrix.arch }}
          file: ${{ matrix.postgres.dockerfile }}

  merge_manifest:
    if: always() && !failure() && !cancelled()
    needs: [prepare, build, build_base_images, build_layered_images]
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_config).include }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - uses: ./.github/actions/nix-install-ephemeral
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Get image tag
        id: get_version
        run: echo "pg_version=supabase/postgres:${{ inputs.postgresVersion != '' && (contains(matrix.tag, '-multigres') && format('{0}-multigres', inputs.postgresVersion) || inputs.postgresVersion) || matrix.tag }}${{ inputs.imageLabel != '' && format('-{0}', inputs.imageLabel) || '' }}" >> $GITHUB_OUTPUT
      - name: Output version
        id: output_version
        run: |
          echo "result=${{ steps.get_version.outputs.pg_version }}" >> $GITHUB_OUTPUT
      - name: Collect versions
        id: collect_versions
        run: |
          echo "${{ steps.output_version.outputs.result }}" >> results.txt  # Append results
      - name: Upload Results Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge_results-${{ matrix.tag }}
          path: results.txt
          if-no-files-found: warn
      - name: Merge multi-arch manifests
        run: |
          docker buildx imagetools create -t ${{ steps.get_version.outputs.pg_version }} \
          ${{ steps.get_version.outputs.pg_version }}_amd64 \
          ${{ steps.get_version.outputs.pg_version }}_arm64
  combine_results:
    if: always() && !failure() && !cancelled()
    needs: [prepare, merge_manifest]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout Repo
        uses: supabase/postgres/.github/actions/shared-checkout@HEAD
      - uses: ./.github/actions/nix-install-ephemeral

      - name: Debug Input from Prepare
        run: |
          echo "Raw matrix_config output:"
          echo "${{ needs.prepare.outputs.matrix_config }}"
      - name: Get Versions from Matrix Config
        id: get_versions
        run: |
          nix run nixpkgs#nushell -- -c '
            # Parse the matrix configuration directly
            let matrix_config = (${{ toJson(needs.prepare.outputs.matrix_config) }} | from json)

            # Get versions directly from include array
            let versions = ($matrix_config.include | get tag)

            echo "Versions: $versions"

            # Convert the versions to a comma-separated string
            let versions_str = ($versions | str join ",")
            $"versions=$versions_str" | save --append $env.GITHUB_ENV
          '
      - name: Download Results Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: merge_results-*
      - name: Combine Results
        id: combine
        run: |
          nix run nixpkgs#nushell -- -c '
            # Get all results files and process them in one go
            let files = (ls **/results.txt | get name)
            echo $"Found files: ($files)"

            let matrix = {
              include: (
                $files
                | each { |file| open $file }          # Open each file
                | each { |content| $content | lines }  # Split into lines
                | flatten                             # Flatten the nested lists
                | where { |line| $line != "" }        # Filter empty lines
                | each { |line|
                    # Extract just the version part after the last colon
                    let version = ($line | parse "supabase/postgres:{version}" | get version.0)
                    {version: $version}
                }
              )
            }

            let json_output = ($matrix | to json -r)  # -r for raw output
            echo $"Debug output: ($json_output)"

            $"matrix=($json_output)" | save --append $env.GITHUB_OUTPUT
          '
      - name: Debug Combined Results
        run: |
          echo "Combined Results: '${{ steps.combine.outputs.matrix }}'"
    outputs:
      matrix: ${{ steps.combine.outputs.matrix }}
  publish:
      permissions:
        contents: read
        packages: write
        id-token: write
      needs: combine_results
      strategy:
        matrix: ${{ fromJson(needs.combine_results.outputs.matrix) }}
      uses: ./.github/workflows/mirror.yml
      with:
        version: ${{ matrix.version }}
      secrets: inherit
