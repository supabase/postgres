name: Cache AMI manifest
description: Annotates the AMI rootfs manifest with its version and caches it as the diff baseline

inputs:
  postgres_version:
    description: 'PostgreSQL major version (e.g., 15)'
    required: true
  arch:
    description: 'Architecture (amd64|arm64)'
    required: true
  ami_version:
    description: 'Released AMI/postgres version to stamp into the manifest'
    required: true
  manifest_path:
    description: 'Path to the captured manifest file'
    required: false
    default: /tmp/ami-manifest.txt

runs:
  using: composite
  steps:
    - id: store-path
      shell: bash
      run: echo "path=$(nix eval --raw ".#psql_${{ inputs.postgres_version }}/bin.outPath")" >> "$GITHUB_OUTPUT"

    - shell: bash
      env:
        AMI_VERSION: ${{ inputs.ami_version }}
        MANIFEST_PATH: ${{ inputs.manifest_path }}
      run: |
        printf '%s\n' "# ami-version: $AMI_VERSION" | cat - "$MANIFEST_PATH" > "$MANIFEST_PATH.new"
        mv "$MANIFEST_PATH.new" "$MANIFEST_PATH"

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.manifest_path }}
        key: ami-manifest-${{ inputs.postgres_version }}-${{ inputs.arch }}-${{ steps.store-path.outputs.path }}
