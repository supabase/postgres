name: Diff manifest
description: Restores the cached baseline manifest and diffs it against this build's manifest

inputs:
  key_prefix:
    description: 'Cache key prefix matching the one used by cache-manifest (e.g. ami-manifest-15-amd64)'
    required: true
  publish_hint:
    description: 'Shown when no baseline is cached yet, naming what publishes one'
    required: true
  manifest_path:
    description: 'Path to the manifest this build captured'
    required: false
    default: /tmp/manifest.txt
  diff_path:
    description: 'Path to write the resulting diff to'
    required: false
    default: /tmp/manifest-diff.txt

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest_path }}
      run: mv "$MANIFEST_PATH" /tmp/current-manifest.txt

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.manifest_path }}
        key: ${{ inputs.key_prefix }}-
        restore-keys: ${{ inputs.key_prefix }}-

    - shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest_path }}
        DIFF_PATH: ${{ inputs.diff_path }}
        PUBLISH_HINT: ${{ inputs.publish_hint }}
      run: |
        if [ -s "$MANIFEST_PATH" ]; then
          mv "$MANIFEST_PATH" /tmp/baseline.txt
          BASELINE_VERSION=$(sed -n 's/^# version: //p' /tmp/baseline.txt | head -1)
        else
          touch /tmp/baseline.txt
          BASELINE_VERSION=""
        fi
        mv /tmp/current-manifest.txt "$MANIFEST_PATH"
        {
          if [ -z "$BASELINE_VERSION" ]; then
            echo "No baseline cached yet. $PUBLISH_HINT"
          elif diff -q /tmp/baseline.txt "$MANIFEST_PATH" > /dev/null; then
            echo "No changes vs baseline $BASELINE_VERSION."
          else
            echo "baseline: $BASELINE_VERSION"
            diff -u /tmp/baseline.txt "$MANIFEST_PATH" || true
          fi
        } | tee "$DIFF_PATH"
