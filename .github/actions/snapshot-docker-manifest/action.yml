name: Snapshot Docker manifest
description: Runs manifest-snapshot.sh inside a Docker image, optionally pulling it first

inputs:
  image:
    description: 'Image ref to snapshot'
    required: true
  pull:
    description: 'Pull the image before snapshotting (needed when it was just pushed, not locally built)'
    required: false
    default: 'false'
  manifest_path:
    description: 'Path to write the manifest to'
    required: false
    default: /tmp/manifest.txt

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PULL: ${{ inputs.pull }}
        MANIFEST_PATH: ${{ inputs.manifest_path }}
      run: |
        if [ "$PULL" = "true" ]; then
          docker pull "$IMAGE"
        fi
        docker run --rm -v "$PWD/testinfra/manifest-snapshot.sh:/manifest-snapshot.sh:ro" \
          "$IMAGE" sh /manifest-snapshot.sh > "$MANIFEST_PATH"
