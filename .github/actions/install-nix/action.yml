name: Install Nix on ephemeral runners
description: Installs Nix and sets up AWS credentials to push to the Nix binary cache
inputs:
  aws-region:
    description: AWS region for the Nix binary cache S3 bucket
    required: false
    default: us-east-1
  nix-signing-key:
    description: Key used to sign uploads to binary cache, required if push-to-cache is true
    required: false
  push-to-cache:
    description: Whether to push build outputs to the Nix binary cache
    required: false
    default: false
  role-to-assume:
    description: AWS Role to assume when configuring aws credentials, required if push-to-cache is true
    required: false
  single-user:
    description: Install Nix in single-user mode, without the Nix daemon, even when systemd is running. Eval-heavy jobs run faster this way.
    required: false
    default: false
  sticky-disk:
    description: Blacksmith sticky disk holding a Nix store to substitute from, Linux only. One of none, read, or write. read discards changes at job end, write commits them when the job succeeds.
    required: false
    default: none
runs:
  using: composite
  steps:
    - name: resolve push-to-cache
      id: resolve-push-to-cache
      shell: bash
      run: |
        VALUE=false
        if [[ "$PUSH_TO_CACHE" == true && -n ${NIX_SIGNING_KEY:+ok} && -n ${ROLE_TO_ASSUME:+ok} ]]; then
          VALUE=true
        elif [[ "$PUSH_TO_CACHE" == true ]]; then
          echo "::notice::push-to-cache requested but nix-signing-key/role-to-assume not set; skipping cache push"
        fi
        echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      env:
        PUSH_TO_CACHE: ${{ inputs.push-to-cache }}
        NIX_SIGNING_KEY: ${{ inputs.nix-signing-key }}
        ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}

    - name: configure aws credentials
      id: aws-creds
      uses: aws-actions/configure-aws-credentials@v6.3.0
      if: steps.resolve-push-to-cache.outputs.value == 'true'
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        output-credentials: true
        output-env-credentials: false
        role-duration-seconds: 7200

    - name: mount nix store disk
      if: inputs.sticky-disk != 'none' && runner.os == 'Linux'
      continue-on-error: ${{ inputs.sticky-disk == 'read' }}
      uses: useblacksmith/stickydisk@v1.8.0
      with:
        key: nix-store-${{ runner.arch }}
        path: /mnt/nix-store-disk
        commit: ${{ inputs.sticky-disk == 'write' }}

    - name: setup nix
      shell: bash
      run: cd ${{ github.action_path }} && ./setup-nix.sh
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.aws-creds.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws-creds.outputs.aws-session-token }}
        GITHUB_TOKEN: ${{ github.token }}
        NIX_SIGN_SECRET_KEY: ${{ inputs.nix-signing-key }}
        PUSH_TO_CACHE: ${{ steps.resolve-push-to-cache.outputs.value }}
        SINGLE_USER: ${{ inputs.single-user }}
        STICKY_DISK: ${{ inputs.sticky-disk }}

    - name: verify nix in path
      shell: bash
      run: nix --version
