#!/usr/sbin/nft -f

# make reloads idempotent - the bare declaration creates the table if it
# doesn't exist yet, so the delete below always succeeds. ('destroy' would
# do both in one step but needs nftables >= 1.0.8 / kernel 6.3)
table inet egressfilter
delete table inet egressfilter

table inet egressfilter {
	# Shared: what a restricted service user may reach on this host.
	# Matches the egress interface, not the destination address: 0.0.0.0, ::,
	# 127.0.0.0/8, ::1 and the host's own IPs all route via lo.
	chain local_egress {
		# Allow -> Postgres (pg_cron, dblink/fdw self-refs, gotrue's DB connection)
		oifname "lo" tcp dport 5432 counter accept

		# Allow DNS to the systemd-resolved stub listener, so outbound HTTP
		# (pg_net, gotrue) can still resolve hostnames.
		oifname "lo" ip daddr 127.0.0.53 udp dport 53 counter accept
		oifname "lo" ip daddr 127.0.0.53 tcp dport 53 counter accept

		# Block every other local destination
		oifname "lo" counter reject
	}

	# gotrue only. postgres must never enter this chain: wal-g/admin-mgr run
	# as postgres and need instance metadata for IAM credentials.
	chain gotrue_egress {
		# Block cloud instance metadata (SSRF target) -- IPv4 and IPv6
		ip  daddr 169.254.169.254 counter reject
		ip6 daddr fd00:ec2::254   counter reject

		jump local_egress
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# Replies to inbound local clients are 'established' — let them pass.
		# Without this, psql -h 127.0.0.1 into Postgres breaks.
		ct state != new accept

		meta skuid "postgres" jump local_egress
		meta skuid "gotrue"   jump gotrue_egress
	}
}
