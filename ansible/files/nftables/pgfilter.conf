#!/usr/sbin/nft -f

# make reloads idempotent - the bare declaration creates the table if it
# doesn't exist yet, so the delete below always succeeds. ('destroy' would
# do both in one step but needs nftables >= 1.0.8 / kernel 6.3)
table inet pgfilter
delete table inet pgfilter

table inet pgfilter {
	chain pg_egress {
		# Replies to inbound local clients are 'established' — let them pass.
		# Without this, psql -h 127.0.0.1 into Postgres breaks.
		ct state != new return

		# Allow Postgres -> Postgres on loopback (pg_cron, dblink/fdw self-refs)
		ip  daddr 127.0.0.0/8 tcp dport 5432 counter accept
		ip6 daddr ::1         tcp dport 5432 counter accept

		# Allow DNS to the systemd-resolved stub listener, so pg_net's own
		# outbound HTTP requests can still resolve hostnames.
		ip daddr 127.0.0.53 udp dport 53 counter accept
		ip daddr 127.0.0.53 tcp dport 53 counter accept

		# Block every other loopback destination
		ip  daddr 127.0.0.0/8 counter reject
		ip6 daddr ::1         counter reject
	}

	chain output {
		type filter hook output priority filter; policy accept;
		meta skuid "postgres" jump pg_egress
	}
}
