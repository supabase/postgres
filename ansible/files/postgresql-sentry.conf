# /etc/systemd/system/postgresql.service.d/sentry.conf
#
# systemd drop-in: makes PostgreSQL depend on sentry-env.service
# and loads /run/sentry.env into the PostgreSQL process environment.
# /run is tmpfs — the secret never touches disk.
#
# Install: copy to /etc/systemd/system/postgresql.service.d/sentry.conf
# Then run: systemctl daemon-reload

[Unit]
After=sentry-env.service
Wants=sentry-env.service

[Service]
EnvironmentFile=/run/sentry.env
