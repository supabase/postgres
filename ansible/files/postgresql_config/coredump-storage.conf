[Coredump]
Storage=external
Compress=yes
ProcessSizeMax=256M
ExternalSizeMax=256M
MaxUse=512M
# Every systemd-coredump run, including for processes that aren't allowed to
# dump, first deletes stored cores while free space is below KeepFree. Small
# instances have well under 5G free on the root fs, so a higher value deletes
# a postgres core still waiting to be processed as soon as anything else
# crashes. Unset is not "off": the default is 15% of the fs, up to 4G.
KeepFree=1G
