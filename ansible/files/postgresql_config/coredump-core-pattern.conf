# Ubuntu's /usr/lib/sysctl.d/50-coredump.conf passes a hardcoded
# 9223372036854775808 as the crashing process's RLIMIT_CORE, so
# systemd-coredump stores a core for every process and DefaultLimitCORE=0
# has no effect. %c passes the real limit, so only postgresql.service
# (LimitCORE=infinity) gets cores. Must sort after 50-coredump.conf.
kernel.core_pattern=|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h %d
