- name: Envoy - system user
  ansible.builtin.user:
    name: 'envoy'
    state: 'present'

- name: Envoy - download binary
  ansible.builtin.get_url:
    checksum: "{{ envoy_arm_release_checksum if platform == 'arm64' else envoy_x86_release_checksum }}"
    dest: '/opt/envoy'
    group: 'envoy'
    mode: '0700'
    owner: 'envoy'
    # yamllint disable-line rule:line-length
    url: "https://github.com/envoyproxy/envoy/releases/download/v{{ envoy_release }}/envoy-{{ envoy_release }}-linux-{{ envoy_arch }}"
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 2
  vars:
    envoy_arch: "{{ 'aarch_64' if platform == 'arm64' else 'x86_64' }}"

- name: Envoy - download hot restarter script
  ansible.builtin.get_url:
    checksum: "{{ envoy_hot_restarter_release_checksum }}"
    dest: '/opt/envoy-hot-restarter.py'
    group: 'envoy'
    mode: '0700'
    owner: 'envoy'
    # yamllint disable-line rule:line-length
    url: "https://raw.githubusercontent.com/envoyproxy/envoy/v{{ envoy_release }}/restarter/hot-restarter.py"
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 2

- name: Envoy - bump up ulimit
  community.general.pam_limits:
    domain: 'envoy'
    limit_item: 'nofile'
    limit_type: 'soft'
    value: '4096'

- name: Envoy - create script to start envoy
  ansible.builtin.copy:
    dest: '/opt/start-envoy.sh'
    group: 'envoy'
    mode: '0700'
    owner: 'envoy'
    src: 'files/start-envoy.sh'

- name: Envoy - create configuration files
  ansible.builtin.copy:
    dest: '/etc/envoy/'
    directory_mode: '0775'
    group: 'envoy'
    mode: '0664'
    owner: 'envoy'
    src: 'files/envoy_config/'

- name: Envoy - create service file
  ansible.builtin.copy:
    dest: '/etc/systemd/system/envoy.service'
    mode: '0644'
    src: 'files/envoy.service'

- name: Envoy - disable service
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: false
    name: 'envoy'
    state: 'stopped'
