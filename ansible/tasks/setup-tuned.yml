- name: Install and configure tuned when stage2_nix
  when:
    - (stage2_nix or nixpkg_mode)
  block:
    - name: Install tuned
      ansible.builtin.apt:
        force_apt_get: true
        name: 'tuned'
        policy_rc_d: 101
        state: 'present'
        update_cache: true
      become: true

    - name: Create a tuned profile directory
      ansible.builtin.file:
        group: 'root'
        mode: '0755'
        owner: 'root'
        path: '/etc/tuned/profiles/postgresql'
        state: 'directory'
      become: true

    - name: Create a profile symlink for older tuned versions
      ansible.builtin.file:
        force: true
        group: 'root'
        mode: '0755'
        owner: 'root'
        path: '/etc/tuned/postgresql'
        src: '/etc/tuned/profiles/postgresql'
        state: 'link'
      become: true

    - name: Create a tuned profile
      become: true
      community.general.ini_file:
        create: true
        group: 'root'
        mode: '0644'
        no_extra_spaces: true
        option: 'summary'
        path: '/etc/tuned/profiles/postgresql/tuned.conf'
        section: 'main'
        state: 'present'
        value: 'Tuned profile for PostgreSQL'

    - name: tuned - Disable Transparent Huge Pages (THP)
      become: true
      community.general.ini_file:
        create: true
        group: 'root'
        mode: '0644'
        no_extra_spaces: true
        option: 'transparent_hugepages'
        path: '/etc/tuned/profiles/postgresql/tuned.conf'
        section: 'vm'
        state: 'present'
        value: 'never'

    - name: tuned - Configure all CPUs for maximum performance
      become: true
      community.general.ini_file:
        create: true
        group: 'root'
        mode: '0644'
        no_extra_spaces: true
        option: "{{ cpu_item['option'] }}"
        path: '/etc/tuned/profiles/postgresql/tuned.conf'
        section: "{{ cpu_item['section'] }}"
        state: 'present'
        value: "{{ cpu_item['value'] }}"
      loop:
        - { section: 'cpu', option: 'governor', value: 'performance' }
      loop_control:
        loop_var: 'cpu_item'

    - name: tuned - Configure Intel CPUs for maximum performance
      become: true
      community.general.ini_file:
        create: true
        group: 'root'
        mode: '0644'
        no_extra_spaces: true
        option: "{{ cpu_item['option'] }}"
        path: '/etc/tuned/profiles/postgresql/tuned.conf'
        section: "{{ cpu_item['section'] }}"
        state: 'present'
        value: "{{ cpu_item['value'] }}"
      loop:
        - { section: 'cpu', option: 'energy_perf_bias', value: 'performance' }
        - { section: 'cpu', option: 'min_perf_pct',     value: '100' }
      loop_control:
        loop_var: 'cpu_item'
      when:
        - ansible_facts['processor'][0] is search("GenuineIntel", ignorecase=True)

    - name: tuned - Enable zswap if swap is present
      when:
        - ansible_facts['swaptotal_mb'] > 0
      block:
        - name: tuned - Decrease the kernel swappiness
          become: true
          community.general.ini_file:
            create: true
            group: 'root'
            mode: '0644'
            no_extra_spaces: true
            option: 'vm.swappiness'
            path: '/etc/tuned/profiles/postgresql/tuned.conf'
            section: 'sysctl'
            state: 'present'
            value: 10


        - name: tuned - Set tcp_keepalive_intvl
          become: true
          community.general.ini_file:
            create: true
            group: 'root'
            mode: '0644'
            no_extra_spaces: true
            option: 'net.ipv4.tcp_keepalive_intvl'
            path: '/etc/tuned/profiles/postgresql/tuned.conf'
            section: 'sysctl'
            state: 'present'
            value: 60
        - name: tuned - Set tcp_keepalive_time
          become: true
          community.general.ini_file:
            create: true
            group: 'root'
            mode: '0644'
            no_extra_spaces: true
            option: 'net.ipv4.tcp_keepalive_time'
            path: '/etc/tuned/profiles/postgresql/tuned.conf'
            section: 'sysctl'
            state: 'present'
            value: 1800
        - name: tuned - Load zstd compressor module
          become: true
          community.general.modprobe:
            name: 'zstd'
            persistent: 'present'
            state: 'present'

        - name: tuned - Configure and enable zswap
          ansible.builtin.shell:
            cmd: "echo {{ zswap_item['value'] }}  > /sys/module/zswap/parameters/{{ zswap_item['param'] }}"
          loop:
            - { param: 'compressor',       value: 'zstd' }
            - { param: 'max_pool_percent', value: '10' }
            - { param: 'zpool',            value: 'zsmalloc' }
            - { param: 'enabled',          value: 'Y' }
          loop_control:
            loop_var: 'zswap_item'

    - name: tuned - Adjust the bootloader cmdline options
      become: true
      community.general.ini_file:
        create: true
        group: 'root'
        mode: '0644'
        no_extra_spaces: true
        option: 'cmdline'
        path: '/etc/tuned/profiles/postgresql/tuned.conf'
        section: 'bootloader'
        state: 'present'
        value: "{{ final_cmdline }}"
      vars:
        cmdline_thp: 'transparent_hugepage=never'
        cmdline_zswap: "{{ 'zswap.enabled=1 zswap.zpool=zsmalloc zswap.compressor=zstd zswap.max_pool_percent=10' if ansible_facts['swaptotal_mb'] > 0 else '' }}"
        final_cmdline: "{{ [cmdline_thp, cmdline_zswap] | reject('equalto', '') | list | join(' ') }}"
        
    - name: Activate the tuned service
      ansible.builtin.systemd_service:
        daemon_reload: true
        enabled: true
        name: 'tuned'
        state: 'restarted'
      become: true

    - name: Activate the PostgreSQL tuned profile
      ansible.builtin.command:
        cmd: tuned-adm profile postgresql
      become: true
      changed_when: false
