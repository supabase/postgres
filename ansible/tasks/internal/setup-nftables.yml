- name: nftables overrides
  file:
    state: directory
    path: /etc/nftables
    owner: adminapi

- name: nftables empty config
  file:
    state: touch
    path: /etc/nftables/supabase_managed.conf
    owner: adminapi

- name: include managed config
  shell: |
    cat >> "/etc/nftables.conf" << EOF
    table inet supabase_managed { }
    include "/etc/nftables/supabase_managed.conf";

    EOF

- name: install per-user egress filters
  copy:
    src: "files/nftables/{{ item }}"
    dest: "/etc/nftables/{{ item }}"
    owner: adminapi
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s
  loop:
    - pgfilter.conf
    - authfilter.conf

- name: include per-user egress filters
  blockinfile:
    path: /etc/nftables.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK: per-user egress filters"
    block: |
      include "/etc/nftables/pgfilter.conf";
      include "/etc/nftables/authfilter.conf";

# A broken /etc/nftables.conf fails nftables.service at boot, and ufw Requires= it.
# The rules are not loaded during the build; they apply on first boot.
- name: check the full nftables config parses
  command: /usr/sbin/nft -c -f /etc/nftables.conf
  changed_when: false

- name: ufw overrides dir
  file:
    state: directory
    path: /etc/systemd/system/ufw.service.d
    owner: root

- name: Custom systemd overrides
  copy:
    src: files/ufw.service.conf
    dest: /etc/systemd/system/ufw.service.d/overrides.conf

- name: reload systemd
  systemd:
    daemon_reload: yes
