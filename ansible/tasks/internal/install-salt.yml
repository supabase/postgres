- name: Add apt repository for Saltstack (arm)
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: salt gpg key
      ansible.builtin.get_url:
        url: https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
        dest: /etc/apt/keyrings/salt-archive-keyring-2023.pgp
        mode: '0644'
      register: download_result
      until: download_result is succeeded
      retries: 3
      delay: 2

    - name: salt apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/salt-archive-keyring-2023.pgp arch=arm64] https://packages.broadcom.com/artifactory/saltproject-deb/ stable main"
        filename: "salt"
        state: present
  when: platform == "arm64"

- name: Add apt repository for Saltstack (amd)
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: salt gpg key
      ansible.builtin.get_url:
        url: https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
        dest: /etc/apt/keyrings/salt-archive-keyring-2023.pgp
        mode: '0644'
      register: download_result
      until: download_result is succeeded
      retries: 3
      delay: 2

    - name: salt apt repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/salt-archive-keyring-2023.pgp arch=amd64] https://packages.broadcom.com/artifactory/saltproject-deb/ stable main"
        filename: "salt"
        state: present
  when: platform == "amd64"

- name: Salt minion install
  apt:
    name:
      - salt-common={{ salt_version }}
      - salt-minion={{ salt_version }}
    state: present
    update_cache: yes

- name: Pin salt packages at major version
  tags: mmlb
  ansible.builtin.copy:
    content: |
      Package: salt-common salt-minion
      Pin: version {{ salt_version.split('.')[0] }}.*
      Pin-Priority: 1001
    dest: /etc/apt/preferences.d/saltstack-pin
    owner: root
    group: root
    mode: "0644"
