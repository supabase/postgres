- name: Download admin-mgr archive
  get_url:
    url: "https://supabase-public-artifacts-bucket.s3.amazonaws.com/admin-mgr/v{{ adminmgr_release }}/admin-mgr_{{ adminmgr_release }}_linux_{{ platform }}.tar.gz"
    dest: "/tmp/admin-mgr.tar.gz"
    timeout: 90
  register: download_result
  until: download_result is succeeded
  retries: 3
  delay: 2

- name: admin-mgr - unpack archive in /usr/bin/
  unarchive:
    remote_src: yes
    src: /tmp/admin-mgr.tar.gz
    dest: /usr/bin/
    owner: root
